name: 打包 Windows 安装程序

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 0.8.8）
        required: false
        default: "0.8.8"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: 前端语法检查
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),path=require('path');let files=[];function walk(d){for(const f of fs.readdirSync(d)){const p=path.join(d,f);if(fs.statSync(p).isDirectory())walk(p);else if(f.endsWith('.js'))files.push(p)}}walk('src');let ok=0,fail=0;for(const f of files){try{new Function(fs.readFileSync(f,'utf-8'));ok++}catch(e){fail++;console.log('ERR:',f,e.message)}}console.log('JS:',ok,'ok,',fail,'fail');if(fail)process.exit(1)"

      - name: 渲染层冒烟测试
        run: node tests/smoke-renderer.js

      - name: 安装 Tauri CLI
        run: npm install

      - name: 构建（Tauri + NSIS 安装程序）
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: 组装绿色版（免安装 zip）
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.8.8" }
          $out = "pulses-easier-$ver-portable-win64"
          New-Item -ItemType Directory -Force -Path "dist/$out" | Out-Null
          Copy-Item "src-tauri/target/release/pulses-easier.exe" "dist/$out/Pulses Easier.exe"
          # 标记文件：程序看到它就把配置写到同级 data 目录（真绿色）
          "portable" | Set-Content "dist/$out/portable.txt" -NoNewline
          $readme = @(
            "Pulses Easier 绿色版（免安装）",
            "",
            "用法：解压到任意位置，双击「Pulses Easier.exe」即可。",
            "",
            "· 配置与数据保存在同级的 data 目录，删除整个文件夹即完全卸载",
            "· 不写注册表、不碰用户目录、可放 U 盘",
            "· 需要 WebView2 运行时（Win10 1803+ / Win11 已内置）"
          ) -join "`r`n"
          Set-Content "dist/$out/说明.txt" $readme -Encoding UTF8
          # 用 Get-ChildItem -Force 保证 portable.txt 这类文件也进包
          Compress-Archive -Path (Get-ChildItem -Force "dist/$out").FullName `
                           -DestinationPath "dist/$out.zip" -Force
          Write-Host "绿色版：dist/$out.zip"
          Get-Item "dist/$out.zip" | Select-Object Name, Length

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.exe,*.msi |
            Select-Object FullName, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pulses-easier-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/*.zip
          if-no-files-found: warn

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/*.zip
          prerelease: true
