name: 打包 Windows 安装程序

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 0.7.0-glass）
        required: false
        default: "0.7.0-glass"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: 前端语法检查
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),path=require('path');let files=[];function walk(d){for(const f of fs.readdirSync(d)){const p=path.join(d,f);if(fs.statSync(p).isDirectory())walk(p);else if(f.endsWith('.js'))files.push(p)}}walk('src');let ok=0,fail=0;for(const f of files){try{new Function(fs.readFileSync(f,'utf-8'));ok++}catch(e){fail++;console.log('ERR:',f,e.message)}}console.log('JS:',ok,'ok,',fail,'fail');if(fail)process.exit(1)"

      - name: 安装 Tauri CLI
        run: npm install

      - name: 构建（Tauri + NSIS 安装程序）
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.exe,*.msi |
            Select-Object FullName, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pulses-easier-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          prerelease: true
