<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulses Easier</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- 启动页 -->
  <div id="splash" class="splash">
    <img class="splash-logo" src="assets/logo.png" alt="Pulses Easier">
    <div class="splash-progress"><div class="splash-bar"></div></div>
    <div class="splash-text">正在准备…</div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app is-hidden">

    <!-- ══ 侧边栏 ══ -->
    <aside class="sidebar">
      <div class="sb-logo">
        <img src="assets/logo.png" alt="Pulses Easier">
        <div class="sb-credit">Produced by Pulses0 Studio.</div>
        <div class="sb-credit">Made by NimShade &amp; DS.</div>
      </div>

      <div class="sb-scroll">
        <!-- 当前整合包 -->
        <div class="sb-card" id="sb-modpack">
          <div class="sb-card-head"><span>当前整合包</span></div>
          <div class="sb-modpack-name" id="sb-modpack-name">未定位</div>
          <div class="sb-modpack-meta" id="sb-modpack-meta"></div>
        </div>

        <!-- 最近打开 -->
        <div class="sb-card" id="sb-recent">
          <div class="sb-card-head">
            <span>最近打开</span>
            <button class="sb-mini" id="btn-recent-clear">清空</button>
          </div>
          <div class="sb-list" id="sb-recent-list"></div>
        </div>

        <!-- 白名单（仅开发者） -->
        <div class="sb-card is-hidden" id="sb-whitelist">
          <div class="sb-card-head">
            <span>校验白名单</span>
            <button class="sb-mini" id="btn-whitelist-add">＋</button>
          </div>
          <div class="sb-list" id="sb-whitelist-list"></div>
        </div>

        <!-- 更多 -->
        <div class="sb-card" id="sb-more">
          <div class="sb-card-head"><span>更多</span></div>
          <button class="sb-item" id="btn-prefs">⚙ 首选项</button>
          <button class="sb-item" id="btn-clean-cache">🗑 清理缓存</button>
          <button class="sb-item" id="btn-db-location">🗄 数据库位置</button>
        </div>
      </div>

      <!-- 身份切换 -->
      <div class="sb-identity">
        <div class="seg" id="identity-switch">
          <button class="seg-btn is-active" data-id="player">玩家</button>
          <button class="seg-btn" data-id="developer">开发者</button>
        </div>
      </div>
    </aside>

    <!-- ══ 主区 ══ -->
    <main class="main">

      <!-- ── 玩家端：三大块 ── -->
      <section id="player-view" class="view is-active">
        <div class="col col-left">

          <!-- STEP 1 -->
          <div class="block block-step1">
            <div class="block-head">
              <span class="step-badge">STEP 1</span>
              <span class="block-title">选择整合包文件夹</span>
            </div>
            <div class="block-body">
              <button class="btn btn-pick" id="btn-pick-modpack">
                <span class="btn-ico">📁</span>
                <span>选择整合包文件夹…</span>
              </button>
              <div class="picked is-hidden" id="modpack-picked">
                <div class="picked-name" id="modpack-name"></div>
                <div class="picked-meta" id="modpack-meta"></div>
              </div>
              <div class="sub-title">已选过的（点击直接使用）</div>
              <div class="recent-list" id="step1-recent"></div>
            </div>
          </div>

          <!-- STEP 2 -->
          <div class="block block-step2">
            <div class="block-head">
              <span class="step-badge">STEP 2</span>
              <span class="block-title">选择更新包</span>
            </div>
            <div class="block-body">
              <div class="drop-zone" id="drop-zone">
                <div class="drop-text">拖入更新包（.zip / .eapack）</div>
                <div class="drop-hint">或点击选择文件</div>
              </div>
              <div class="row-between">
                <div class="pack-name" id="pack-name"></div>
                <button class="btn btn-ghost is-hidden" id="btn-clear-pack">清空</button>
              </div>
            </div>
          </div>

        </div>

        <div class="col col-right">
          <!-- STEP 3 -->
          <div class="block block-step3">
            <div class="block-head">
              <span class="step-badge">STEP 3</span>
              <span class="block-title">开始更新</span>
            </div>
            <div class="block-body block-body-grow">
              <button class="btn-start" id="btn-start" disabled>开始更新</button>

              <div class="progress-panel is-hidden" id="progress-panel">
                <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="progress-text" id="progress-text">就绪</div>
              </div>

              <div class="sub-title">日志</div>
              <div class="log-list" id="log-list"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ── 开发者端 ── -->
      <section id="developer-view" class="view is-hidden">
        <div class="col col-left">

          <div class="block block-step1">
            <div class="block-head">
              <span class="step-badge">STEP 1</span>
              <span class="block-title">选择新版本整合包</span>
            </div>
            <div class="block-body">
              <button class="btn btn-pick" id="btn-pick-newpack">
                <span class="btn-ico">📦</span>
                <span>选择新版本文件夹…</span>
              </button>
              <div class="picked is-hidden" id="newpack-picked">
                <div class="picked-name" id="newpack-name"></div>
                <div class="picked-meta" id="newpack-meta"></div>
              </div>
              <div class="sub-title">已选过的</div>
              <div class="recent-list" id="dev-recent"></div>
            </div>
          </div>

          <div class="block block-step2">
            <div class="block-head">
              <span class="step-badge">STEP 2</span>
              <span class="block-title">选择旧版本整合包</span>
            </div>
            <div class="block-body">
              <button class="btn btn-pick" id="btn-pick-oldpack">
                <span class="btn-ico">📂</span>
                <span>选择旧版本文件夹…</span>
              </button>
              <div class="picked is-hidden" id="oldpack-picked">
                <div class="picked-name" id="oldpack-name"></div>
                <div class="picked-meta" id="oldpack-meta"></div>
              </div>
            </div>
          </div>

        </div>

        <div class="col col-right">
          <div class="block block-step3">
            <div class="block-head">
              <span class="step-badge">STEP 3</span>
              <span class="block-title">比对并导出更新包</span>
            </div>
            <div class="block-body block-body-grow">
              <button class="btn-start" id="btn-build" disabled>比对并导出更新包</button>

              <div class="diff-summary is-hidden" id="diff-summary"></div>

              <div class="sub-title">更新日志（Markdown）</div>
              <textarea class="md-input" id="changelog-input"
                        placeholder="在这里写本次更新的说明…"></textarea>

              <div class="sub-title">日志</div>
              <div class="log-list" id="dev-log-list"></div>
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer class="statusbar">
      <span id="status-text">就绪</span>
      <span id="status-version"></span>
    </footer>
  </div>

  <!-- 弹窗挂载点 -->
  <div id="overlay-container"></div>

  <script src="js/preload-tauri.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/glass.js"></script>
  <script src="js/widgets/overlay.js"></script>
  <script src="js/widgets/tooltip.js"></script>
  <script src="js/widgets/log.js"></script>
  <script src="js/widgets/recent.js"></script>
  <script src="js/views/player.js"></script>
  <script src="js/views/developer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
