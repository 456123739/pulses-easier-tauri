<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulses Easier</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- 启动页 -->
  <div id="splash" class="splash">
    <img class="splash-logo" src="assets/logo.png" alt="Pulses Easier">
    <div class="splash-track"><i></i></div>
  </div>

  <!-- ══ 自定义标题栏（常驻，启动页也盖不住它）══ -->
  <header class="titlebar" data-tauri-drag-region>
    <span class="titlebar-title" data-tauri-drag-region>Pulses Easier</span>
    <div class="titlebar-actions">
      <button class="tb-btn" id="win-min" title="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="tb-btn" id="win-max" title="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="tb-btn tb-close" id="win-close" title="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </header>

  <div id="app" class="app is-hidden">

    <!-- ══ 侧边栏 ══ -->
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="Pulses Easier">
        <span class="brand-sub">Pulses0 Studio</span>
      </div>

      <div class="sb-scroll">
        <section class="group">
          <div class="group-title">整合包</div>
          <div class="card">
            <div class="row row-static">
              <span class="row-label" id="sb-modpack-name">未定位</span>
            </div>
            <div class="row-note" id="sb-modpack-meta"></div>
          </div>
        </section>

        <section class="group">
          <div class="group-title">
            <span>最近</span>
            <button class="link-btn" id="btn-recent-clear">清空</button>
          </div>
          <div class="card">
            <div class="list" id="sb-recent-list"></div>
          </div>
        </section>

        <section class="group">
          <div class="card" id="mode-options">
            <div class="opt" data-mode="player">
              <button class="row" id="nav-locate">
                <span class="row-label">定位整合包</span><span class="chev">›</span>
              </button>
            </div>
            <div class="opt" data-mode="player">
              <button class="row" id="nav-pickpack">
                <span class="row-label">选择更新包</span><span class="chev">›</span>
              </button>
            </div>
            <div class="opt" data-mode="developer">
              <button class="row" id="nav-newpack">
                <span class="row-label">选择新版本</span><span class="chev">›</span>
              </button>
            </div>
            <div class="opt" data-mode="developer">
              <button class="row" id="nav-oldpack">
                <span class="row-label">选择旧版本</span><span class="chev">›</span>
              </button>
            </div>
            <div class="opt-sep" data-mode="developer"></div>
            <button class="row" id="btn-clean-cache">
              <span class="row-label">清理缓存</span><span class="chev">›</span>
            </button>
            <button class="row" id="btn-prefs">
              <span class="row-label">设置</span><span class="chev">›</span>
            </button>
          </div>
        </section>
      </div>

      <div class="sb-foot">
        <div class="seg" id="identity-switch">
          <span class="seg-pill" id="seg-pill"></span>
          <button class="seg-btn is-active" data-id="player">玩家</button>
          <button class="seg-btn" data-id="developer">开发者</button>
        </div>
      </div>
    </aside>

    <!-- ══ 主区 ══ -->
    <main class="main">

      <!-- 玩家端 -->
      <section id="player-view" class="view is-active">
        <div class="col col-left">

          <article class="card step">
            <div class="step-head">
              <span class="step-num">1</span>
              <h2>整合包</h2>
            </div>
            <div class="step-body">
              <button class="row row-action" id="btn-pick-modpack">
                <span class="row-label">选择文件夹</span>
                <span class="chev">›</span>
              </button>
              <div class="picked is-hidden" id="modpack-picked">
                <div class="picked-name" id="modpack-name"></div>
                <div class="picked-meta" id="modpack-meta"></div>
              </div>
              <div class="list" id="step1-recent"></div>
            </div>
          </article>

          <article class="card step">
            <div class="step-head">
              <span class="step-num">2</span>
              <h2>更新包</h2>
            </div>
            <div class="step-body">
              <div class="drop" id="drop-zone">
                <span class="drop-main">拖入或选择</span>
              </div>
              <div class="row-between">
                <span class="pack-name" id="pack-name"></span>
                <button class="link-btn is-hidden" id="btn-clear-pack">清空</button>
              </div>
            </div>
          </article>

        </div>

        <div class="col col-right">
          <article class="card step step-cta">
            <div class="step-head">
              <span class="step-num">3</span>
              <h2>更新</h2>
            </div>
            <div class="step-body">
              <button class="cta" id="btn-start" disabled>
                <span class="cta-label">开始更新</span>
              </button>
              <div class="progress is-hidden" id="progress-panel">
                <div class="progress-track"><i class="progress-fill" id="progress-fill"></i></div>
                <div class="progress-text" id="progress-text"></div>
              </div>
              <div class="changes is-hidden" id="change-list"></div>
              <div class="log-divider"></div>
              <div class="log" id="log-list"></div>
            </div>
          </article>
        </div>
      </section>

      <!-- 开发者端 -->
      <section id="developer-view" class="view">
        <div class="col col-left">

          <article class="card step">
            <div class="step-head">
              <span class="step-num">1</span>
              <h2>新版本</h2>
            </div>
            <div class="step-body">
              <button class="row row-action" id="btn-pick-newpack">
                <span class="row-label">选择文件夹</span>
                <span class="chev">›</span>
              </button>
              <div class="picked is-hidden" id="newpack-picked">
                <div class="picked-name" id="newpack-name"></div>
                <div class="picked-meta" id="newpack-meta"></div>
              </div>
              <div class="list" id="dev-recent"></div>
            </div>
          </article>

          <article class="card step">
            <div class="step-head">
              <span class="step-num">2</span>
              <h2>旧版本</h2>
            </div>
            <div class="step-body">
              <button class="row row-action" id="btn-pick-oldpack">
                <span class="row-label">选择文件夹</span>
                <span class="chev">›</span>
              </button>
              <div class="picked is-hidden" id="oldpack-picked">
                <div class="picked-name" id="oldpack-name"></div>
                <div class="picked-meta" id="oldpack-meta"></div>
              </div>
            </div>
          </article>

          <!-- 白名单：填在左列下方空白处 -->
          <article class="card wl-card">
            <div class="wl-head">
              <span class="group-title">白名单</span>
              <button class="link-btn" id="btn-whitelist-add">＋</button>
            </div>
            <div class="wl-list" id="whitelist-list"></div>
          </article>

        </div>

        <div class="col col-right">
          <article class="card step step-cta">
            <div class="step-head">
              <span class="step-num">3</span>
              <h2>导出</h2>
            </div>
            <div class="step-body">
              <button class="cta" id="btn-build" disabled>
                <span class="cta-label">比对并导出</span>
              </button>

              <div class="diff-summary is-hidden" id="diff-summary"></div>

              <textarea class="md-input" id="changelog-input"
                        placeholder="更新日志"></textarea>

              <div class="log-divider"></div>
              <div class="log" id="dev-log-list"></div>
            </div>
          </article>
        </div>
      </section>

    </main>

    <footer class="statusbar">
      <span class="status-text" id="status-text">就绪</span>
      <span class="status-ver" id="status-version"></span>
    </footer>
  </div>

  <div id="overlay-container"></div>

  <script src="js/preload-tauri.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/glass.js"></script>
  <script src="js/widgets/anim.js"></script>
  <script src="js/widgets/theme.js"></script>
  <script src="js/widgets/overlay.js"></script>
  <script src="js/widgets/log.js"></script>
  <script src="js/widgets/recent.js"></script>
  <script src="js/widgets/reveal.js"></script>
  <script src="js/views/player.js"></script>
  <script src="js/views/developer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
